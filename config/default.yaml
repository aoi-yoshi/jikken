# All paths are relative to project root unless absolute.
project:
  root: "."

model:
  id: "Qwen/Qwen2.5-VL-3B-Instruct"
  attn_implementation: "sdpa"

data:
  # NEXAR Collision Prediction dataset (binary: negative=0, positive=1).
  nexar_root: "C:/nexar_collision_prediction"
  nexar_train_subdir: "train"
  nexar_test_subdir: "test-public"
  synthetic_dir: "data/synthetic"
  manifest_path: "artifacts/datasets/manifest.jsonl"
  test_manifest_path: "artifacts/datasets/test_manifest.jsonl"
  num_classes: 2
  num_frames: 8                     # 0.5s 間隔で 8 枚（positive: 事故時刻終端 / negative: ランダム始点）
  frame_interval_sec: 0.5           # 連続フレーム間隔 [秒]
  frame_max_side: 480               # 抽出 JPEG の長辺上限（8 枚入力時の VRAM 対策）
  frame_sampling: "event_window"    # "event_window" | "alert_event" | "uniform"
  negative_time_mode: "random_start"  # event_window 時: negative はランダム始点
  # step02 フレーム抽出: NEXAR metadata に時刻が無いときの代替秒数
  #   positive: time_of_alert / time_of_event の欠損時
  #   negative (alert_event モード): データセット平均時刻の代わり
  fallback_alert_sec: 18.5
  fallback_event_sec: 19.7
  # train/eval 分割（step03/04/05 共通）
  #   train_ratio < 1.0: 先頭 ratio 分が学習プール、続く eval_max が eval
  #   train_ratio >= 1.0: 全件から末尾 eval_max を eval、残りが学習プール（無駄なし）
  train_ratio: 1.0
  max_videos_per_class: 150         # train: negative/positive 各 150 → 計 300 本
  max_test_videos_per_class: 20
  max_eval_samples: 80              # test_manifest 用（学習パイプラインでは train.eval_max を使用）
  use_num_frames: 4                 # 0 = 全フレーム; 8 枚保存の末尾 4 枚をモデル入力に使う
  use_frame_slice: "last"           # "last" | "first"
  weather_filter: "Clear"           # 空文字なら天候フィルタなし
  image_prompt: "Classify this driving scene as normal or risk. Answer with one number only: 0 for normal, 1 for risk."
#これから起こるかどうかを教えてあげるのも結構よさそう。
train:
  seed: 42
  batch_size: 1                 # step04b probe 結果 (RTX 5050 8GB): max=2
  # --- 以下が step03/04/05(FL) で実際に参照される学習・評価設定 ---
  max_train_samples: 60           # クラス別上限（×2クラス=120件抽出→学習100+eval20、各client50）
  eval_max: 20                    # 共通 eval 本数（train_ratio>=1 時は抽出120件のうち末尾20）
  # --- 以下は step04b 専用（FL は client 分割の全サンプル × fl.local_epochs）---
  train_count: 100                # step04b: probe 除外後に学習に使う件数
  steps: 1000                     # step04b: 学習ステップ上限
  lr: 1.0e-4
  weight_decay: 0.01
  max_length: 256
  min_pixels: 50176   # ~224*224*1; processor uses pixel budget
  max_pixels: 98304   # 4 フレーム入力向け（OOM 時は frame_max_side を下げる）
  use_gradient_checkpointing: true

  probe_idx: 0          # プローブに使うデータのインデックス番号

lora:
  # 本番設定（教授・実験計画）: r=8, q_proj + v_proj
  # LoRA 比較する場合は r / target_modules を一時編集（別 YAML は不要）
  r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

consistency:
  w_pred: 0.5
  w_grad: 0.1
  w_post: 0.5
  inner_lr: 1.0e-4
  temperature: 2.0
  teacher_source: recompute   # recompute | transmitted（Stage 1: transmitted）
  surrogate_ema: 1.0       # 1.0 = surrogate keeps initial state (LoRA contribution ~ 0 → ≈ foundation F)
  sync_surrogate_at_epoch: false  # false なら surrogate を client にコピーしない (F as base reference)

# Flower（step05）— 設定はこのファイルのみ。切替は fl.partition.mode 等を編集。
# スモーク: num_rounds=1, train.max_train_samples を小さく（例: 8）
# IID本番: partition.mode=iid_shuffle, num_rounds=3, train.eval_max=40
# Non-IID: partition.mode=label_skew_dirichlet, label_skew_alpha=0.2
#          または label_skew_extreme / key_skew（key_field: scene）
fl:
  # ラウンド指標: post_redistribution_*, local_adaptation_*, foundation_generalization_*,
  # weight_divergence_*, round_timing（フェーズ別所要時間）
  consistency_mode: "none"           # none | lpred | lpred_grad | lpred_post（Step 7 AC 損失）
  strategy: "FedAvg"                 # FedAvg | FedProx
  fedprox_mu: 0.01                   # FedProx 時の proximal 係数 μ
  num_rounds: 3
  local_epochs: 2
  sample_fraction: 1.0
  min_fit_clients: 2
  min_available_clients: 2
  num_clients: 2
  gpu_serialize: true              # 1台1GPU: Flower client 同時接続でも GPU 区間を順番実行（マルチPCなら false）
  checkpoint_name: "step05_fedavg_global.pt"   # ファイル名（保存先は checkpoint_subdir/<run_id>/ 以下）
  checkpoint_subdir: "step05_fl"               # artifacts/checkpoints/step05_fl/<run_id>/
  partition:
    mode: "iid_shuffle"           # iid_shuffle | label_skew_dirichlet | label_skew_extreme | key_skew
    seed: 42                      # 未指定時は train.seed
    label_skew_alpha: 0.2         # label_skew_dirichlet 時（小さいほど偏り強）
    key_field: "scene"            # key_skew 時
    max_samples_per_client: null  # 整数で各 client 上限（null=制限なし）

artifacts:
  root: "artifacts"
  checkpoints: "artifacts/checkpoints"
  logs: "artifacts/logs"
  metrics: "artifacts/metrics"
  runs: "artifacts/runs"
