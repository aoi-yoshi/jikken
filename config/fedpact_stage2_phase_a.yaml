# FedPACT Stage II Phase A: local-adaptation diagnostic.
# This is alert-interval clip classification, not early accident anticipation.
model:
  id: "Qwen/Qwen2.5-VL-3B-Instruct"
  server_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  client_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  attn_implementation: "sdpa"

data:
  num_frames: 4
  use_num_frames: 4
  use_frame_slice: "last"
  input_mode: "video"
  task_contract: "alert_interval_clip_classification_not_early_anticipation"
  frame_sampling: "paired_alert_event_quartiles"
  frame_max_side: 480
  weather_filter: ""
  image_prompt: "Classify this driving scene as normal or risk. Answer with one number only: 0 for normal, 1 for risk."

train:
  seed: 20260921
  batch_size: 1
  lr: 3.0e-5
  weight_decay: 0.01
  min_pixels: 50176
  max_pixels: 98304
  use_gradient_checkpointing: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules: ["q_proj", "v_proj"]
  bias: "none"
